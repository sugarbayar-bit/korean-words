<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>한국어 Words</title>
  <meta name="theme-color" content="#2f5d8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="한국어 Words">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232f5d8a'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif'>한</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>한국어 <span>Words</span></h1>
    <span id="authBadge" class="badge"></span>
  </header>

  <main id="app">
    <section id="view-test" class="view"></section>
    <section id="view-stats" class="view" hidden></section>
    <section id="view-manage" class="view" hidden></section>
  </main>

  <nav class="tabbar">
    <button data-action="tab" data-view="test" class="active"><span class="ico">📝</span><span>Test</span></button>
    <button data-action="tab" data-view="stats"><span class="ico">📊</span><span>My stats</span></button>
    <button data-action="tab" data-view="manage"><span class="ico">🛠️</span><span>Manage</span></button>
  </nav>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
